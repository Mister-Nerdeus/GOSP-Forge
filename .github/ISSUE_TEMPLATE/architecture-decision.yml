name: Architecture decision
description: Propose a durable architecture decision that may require an ADR.
title: "[ADR] "
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What decision is needed and why now?
    validations:
      required: true

  - type: textarea
    id: options
    attributes:
      label: Options considered
    validations:
      required: true

  - type: textarea
    id: recommendation
    attributes:
      label: Proposed decision
    validations:
      required: true

  - type: textarea
    id: consequences
    attributes:
      label: Consequences and migration impact
    validations:
      required: true
