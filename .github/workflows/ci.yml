name: Phase 0 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify baseline
        run: pnpm verify

      - name: Write CI evidence
        env:
          GOSP_EVIDENCE_DIR: evidence/ci/${{ github.sha }}
        run: pnpm evidence:ci

      - name: Upload CI evidence
        uses: actions/upload-artifact@v4
        with:
          name: gosp-phase0-evidence-${{ github.sha }}
          path: evidence/ci/${{ github.sha }}
          if-no-files-found: error
          retention-days: 30
